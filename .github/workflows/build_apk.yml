name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup zstd source fallback
        run: |
          git clone --depth 1 --branch v1.5.6 https://github.com/facebook/zstd.git /tmp/zstd
          echo "ZSTD_ROOT=/tmp/zstd" >> $GITHUB_ENV

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxypin-release-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ProxyPin 最新构建 (Android APK)"
          body: |
            ### ProxyPin 重构版 (Reqable 同款底层内核)
            - 重构 Android 端 VPN 抓包底层：引入 Rust 原生 tun2proxy 虚拟网卡代理引擎，彻底解决断网与卡顿问题
            - 集成 Virtual DNS (Fake-IP 机制，198.18.0.0/15)，消除 DNS 延迟、超时与污染
            - 新增全局 IPv6 双栈捕获支持，防止双栈网络下因缺 IPv6 路由导致特定 App (如微信/B站/TikTok) 发生泄漏或断网
            - 完整保留所有高级功能：请求重写 (Rewrite)、映射 (Map)、脚本 (Script)、屏蔽 (Block)、断点 (Breakpoint) 与工具箱
            - 直接下载下方的 `.apk` 即可安装使用
          draft: false
          prerelease: false
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
